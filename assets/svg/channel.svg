<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="chTitle" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">
  <title id="chTitle">门店获客渠道示意图：六个可组合的本地流量入口</title>
  <defs>
    <radialGradient id="chCenter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E4574"/><stop offset="1" stop-color="#122943"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="640" height="520" rx="20" fill="#F5F9FF"/>

  <g stroke="#B9CCEA" stroke-width="1.6" stroke-dasharray="5 6">
    <path d="M320 260 L320 92"/>
    <path d="M320 260 L485 175"/>
    <path d="M320 260 L485 345"/>
    <path d="M320 260 L320 428"/>
    <path d="M320 260 L155 345"/>
    <path d="M320 260 L155 175"/>
  </g>

  <!-- 中心 -->
  <circle cx="320" cy="260" r="84" fill="url(#chCenter)"/>
  <circle cx="320" cy="260" r="84" fill="none" stroke="#FFB547" stroke-width="1.5" opacity="0.55"/>
  <circle cx="320" cy="260" r="96" fill="none" stroke="#142D4E" stroke-width="1" opacity="0.1"/>
  <text x="320" y="252" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">你的门店</text>
  <text x="320" y="274" text-anchor="middle" font-size="10.5" fill="#FFB547">AI 内容中台</text>
  <text x="320" y="292" text-anchor="middle" font-size="9.5" fill="#9FB3CC">一套素材，多处分发</text>

  <!-- 六个渠道 -->
  <g>
    <rect x="248" y="42" width="144" height="52" rx="14" fill="#FFFFFF" stroke="#E3E9F2"/>
    <circle cx="270" cy="68" r="8" fill="#142D4E"/>
    <text x="286" y="65" font-size="12" font-weight="700" fill="#142D4E">抖音同城</text>
    <text x="286" y="81" font-size="9.5" fill="#778397">短视频 + 团购</text>
  </g>
  <g>
    <rect x="413" y="149" width="152" height="52" rx="14" fill="#FFFFFF" stroke="#E3E9F2"/>
    <circle cx="435" cy="175" r="8" fill="#E8455E"/>
    <text x="451" y="172" font-size="12" font-weight="700" fill="#142D4E">小红书</text>
    <text x="451" y="188" font-size="9.5" fill="#778397">笔记 + 探店</text>
  </g>
  <g>
    <rect x="413" y="319" width="152" height="52" rx="14" fill="#FFFFFF" stroke="#E3E9F2"/>
    <circle cx="435" cy="345" r="8" fill="#1F9D8B"/>
    <text x="451" y="342" font-size="12" font-weight="700" fill="#142D4E">朋友圈 / 社群</text>
    <text x="451" y="358" font-size="9.5" fill="#778397">熟客复购</text>
  </g>
  <g>
    <rect x="248" y="402" width="144" height="52" rx="14" fill="#FFFFFF" stroke="#E3E9F2"/>
    <circle cx="270" cy="428" r="8" fill="#FFB547"/>
    <text x="286" y="425" font-size="12" font-weight="700" fill="#142D4E">美团 / 点评</text>
    <text x="286" y="441" font-size="9.5" fill="#778397">搜索 + 评价</text>
  </g>
  <g>
    <rect x="75" y="319" width="152" height="52" rx="14" fill="#FFFFFF" stroke="#E3E9F2"/>
    <circle cx="97" cy="345" r="8" fill="#3478F6"/>
    <text x="113" y="342" font-size="12" font-weight="700" fill="#142D4E">微信搜索</text>
    <text x="113" y="358" font-size="9.5" fill="#778397">公众号 + 视频号</text>
  </g>
  <g>
    <rect x="75" y="149" width="152" height="52" rx="14" fill="#FFFFFF" stroke="#E3E9F2"/>
    <circle cx="97" cy="175" r="8" fill="#7A5AF5"/>
    <text x="113" y="172" font-size="12" font-weight="700" fill="#142D4E">老客转介绍</text>
    <text x="113" y="188" font-size="9.5" fill="#778397">评价 + 返券</text>
  </g>

  <text x="320" y="492" text-anchor="middle" font-size="10" fill="#9AA9BD">示意图：不必六个都做，先选一个能持续做的渠道</text>
</svg>