<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="bsTitle bsDesc" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif">
  <title id="bsTitle">书籍推荐示意图</title>
  <desc id="bsDesc">书架上排着几本经营与 AI 相关的书，前面摊开一本，旁边有一盏台灯和一张写着读书笔记的便签。</desc>
  <defs>
    <linearGradient id="bsBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFF"/><stop offset="1" stop-color="#F0F4FB"/>
    </linearGradient>
    <linearGradient id="bsNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F416B"/><stop offset="1" stop-color="#142D4E"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="760" height="460" rx="20" fill="url(#bsBg)"/>
  <circle cx="118" cy="86" r="58" fill="#FFB547" opacity="0.1"/>
  <circle cx="672" cy="368" r="64" fill="#3478F6" opacity="0.07"/>

  <!-- 台灯光晕 -->
  <circle cx="620" cy="150" r="86" fill="#FFB547" opacity="0.13"/>
  <g stroke="#142D4E" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M626 108v-26"/>
    <path d="M626 108 596 96"/>
    <path d="M626 250h0"/>
  </g>
  <path d="M592 84h68l-14 26h-40z" fill="#142D4E"/>
  <path d="M608 84v-10" stroke="#142D4E" stroke-width="3" stroke-linecap="round"/>
  <rect x="620" y="106" width="6" height="150" rx="3" fill="#142D4E"/>
  <ellipse cx="623" cy="258" rx="34" ry="7" fill="#142D4E"/>

  <!-- 书架 -->
  <rect x="60" y="286" width="440" height="9" rx="4" fill="#C7D6EA"/>
  <rect x="60" y="380" width="440" height="9" rx="4" fill="#C7D6EA"/>

  <!-- 上排书 -->
  <g>
    <rect x="72" y="196" width="34" height="90" rx="4" fill="#142D4E"/>
    <rect x="79" y="206" width="20" height="3" rx="1.5" fill="#FFB547" opacity="0.9"/>
    <rect x="79" y="214" width="14" height="2.5" rx="1.25" fill="#FFFFFF" opacity="0.45"/>

    <rect x="110" y="176" width="40" height="110" rx="4" fill="#3478F6"/>
    <rect x="118" y="188" width="24" height="3" rx="1.5" fill="#FFFFFF" opacity="0.85"/>
    <rect x="118" y="197" width="16" height="2.5" rx="1.25" fill="#FFFFFF" opacity="0.55"/>

    <rect x="154" y="210" width="30" height="76" rx="4" fill="#E9EFF9"/>
    <rect x="160" y="220" width="18" height="3" rx="1.5" fill="#142D4E" opacity="0.7"/>

    <rect x="188" y="186" width="38" height="100" rx="4" fill="#FFB547"/>
    <rect x="196" y="198" width="22" height="3" rx="1.5" fill="#3D2600" opacity="0.7"/>
    <rect x="196" y="207" width="14" height="2.5" rx="1.25" fill="#3D2600" opacity="0.4"/>

    <rect x="230" y="202" width="32" height="84" rx="4" fill="#1F416B"/>
    <rect x="237" y="212" width="18" height="3" rx="1.5" fill="#FFFFFF" opacity="0.5"/>

    <rect x="266" y="170" width="42" height="116" rx="4" fill="#DCE7F7"/>
    <rect x="274" y="182" width="26" height="3" rx="1.5" fill="#142D4E" opacity="0.65"/>
    <rect x="274" y="191" width="18" height="2.5" rx="1.25" fill="#142D4E" opacity="0.35"/>

    <rect x="312" y="212" width="30" height="74" rx="4" fill="#3478F6" opacity="0.75"/>
    <rect x="318" y="222" width="18" height="3" rx="1.5" fill="#FFFFFF" opacity="0.7"/>

    <!-- 斜靠的一本 -->
    <g transform="rotate(-12 376 286)">
      <rect x="352" y="190" width="34" height="96" rx="4" fill="#142D4E"/>
      <rect x="359" y="200" width="20" height="3" rx="1.5" fill="#FFB547"/>
    </g>
  </g>

  <!-- 下排书 -->
  <g>
    <rect x="80" y="316" width="36" height="64" rx="4" fill="#3478F6" opacity="0.85"/>
    <rect x="88" y="326" width="20" height="3" rx="1.5" fill="#FFFFFF" opacity="0.7"/>
    <rect x="120" y="304" width="42" height="76" rx="4" fill="#E9EFF9"/>
    <rect x="128" y="316" width="26" height="3" rx="1.5" fill="#142D4E" opacity="0.6"/>
    <rect x="166" y="322" width="30" height="58" rx="4" fill="#FFB547"/>
    <rect x="172" y="332" width="18" height="3" rx="1.5" fill="#3D2600" opacity="0.6"/>
    <rect x="200" y="310" width="38" height="70" rx="4" fill="#1F416B"/>
    <rect x="208" y="322" width="22" height="3" rx="1.5" fill="#FFFFFF" opacity="0.5"/>
    <rect x="242" y="328" width="28" height="52" rx="4" fill="#DCE7F7"/>
    <rect x="248" y="338" width="16" height="3" rx="1.5" fill="#142D4E" opacity="0.55"/>
  </g>

  <!-- 摊开的书 -->
  <g transform="translate(430,268)">
    <path d="M0 40c40-14 78-16 112-6v72c-34-10-72-8-112 6z" fill="#FFFFFF" stroke="#D5E1F2" stroke-width="1.5"/>
    <path d="M112 34c34-10 72-8 112 6v72c-40-14-78-16-112-6z" fill="#FFFFFF" stroke="#D5E1F2" stroke-width="1.5"/>
    <path d="M112 34v72" stroke="#D5E1F2" stroke-width="1.5"/>
    <g stroke="#C3D3E8" stroke-width="3" stroke-linecap="round">
      <path d="M24 58h64M24 70h72M24 82h58M24 94h40"/>
      <path d="M136 58h64M128 70h72M136 82h58M144 94h40"/>
    </g>
    <path d="M112 34v30" stroke="#FFB547" stroke-width="4" stroke-linecap="round"/>
    <circle cx="112" cy="34" r="4" fill="#FFB547"/>
  </g>

  <!-- 便签 -->
  <g transform="translate(646,250) rotate(6)">
    <rect width="76" height="76" rx="6" fill="#FFF3DD" stroke="#F2D9AC"/>
    <g stroke="#C99A45" stroke-width="2.4" stroke-linecap="round">
      <path d="M14 24h48M14 36h40M14 48h46M14 60h28"/>
    </g>
    <circle cx="60" cy="60" r="8" fill="#FFB547" opacity="0.55"/>
  </g>

  <!-- 结论气泡 -->
  <g transform="translate(56,96)">
    <rect width="272" height="64" rx="14" fill="#FFFFFF" stroke="#E1EAF7"/>
    <circle cx="30" cy="32" r="12" fill="#142D4E"/>
    <text x="30" y="37" text-anchor="middle" font-size="12" font-weight="700" fill="#FFB547">?</text>
    <text x="52" y="27" font-size="12.5" font-weight="600" fill="#142D4E">读书是为了解决一个具体问题</text>
    <text x="52" y="46" font-size="11" fill="#778397">不是为了把书单刷完</text>
  </g>
</svg>